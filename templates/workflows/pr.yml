name: pr

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

jobs:
  body:
    name: PR body format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - name: Check the PR body opens with a closing keyword
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/lint-pr-body.ts

  commits:
    name: commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      # The commit-msg hook only runs where someone installed it. This runs everywhere.
      - name: Check every commit on the branch
        run: |
          for sha in $(git rev-list --no-merges origin/${{ github.base_ref }}..HEAD); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/message"
            node scripts/lint-commit-message.ts "$RUNNER_TEMP/message" || exit 1
          done
